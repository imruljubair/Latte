[model]
model_dim = 4
qk_dim = 3
value_dim = 4
num_heads = 2
num_layers = 2
ffn_dim = 8
context_length = 8
dropout = 0.0

[data]
path = "data/tiny_corpus.txt"
tokenizer = "char"
train_split = 0.9

[training]
batch_size = 4
steps = 201
learning_rate = 0.003
weight_decay = 0.0
eval_interval = 100
eval_batches = 20
seed = 1337
device = "cpu"

[output]
directory = "out/pages-demo"
checkpoint_name = "model.pt"

[generation]
prompt = "Once upon a time"
max_new_tokens = 120
temperature = 0.8
top_k = 12
